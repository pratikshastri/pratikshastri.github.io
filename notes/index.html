<!DOCTYPE html>
<!-- generated-by-notes-editor -->
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Notes | Pratik Shastri</title>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400..700&amp;display=swap" rel="stylesheet"/>
<link href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.7.1/katex.min.css" rel="stylesheet"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.7.1/katex.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.7.1/contrib/auto-render.min.js"></script>
<style>

    :root {
      --bg: #f4f7f4;
      --text: #191b18;
      --muted: #687069;
      --accent: #517783;
      --rule: #d7ded8;
      --bg-dark: #101411;
      --text-dark: #ecefe8;
      --muted-dark: #a7ada4;
      --accent-dark: #98b8c2;
      --rule-dark: #2c352f;
    }

    *, *::before, *::after {
      box-sizing: border-box;
    }

    html {
      color-scheme: light;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: "Source Serif 4", Georgia, "Times New Roman", serif;
      font-size: 18px;
      line-height: 1.7;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
      transition: background-color 0.25s ease, color 0.25s ease;
    }

    body.dark {
      color-scheme: dark;
      --bg: var(--bg-dark);
      --text: var(--text-dark);
      --muted: var(--muted-dark);
      --accent: var(--accent-dark);
      --rule: var(--rule-dark);
    }

    ::selection {
      background: rgba(81, 119, 131, 0.2);
    }

    p {
      margin: 0;
    }

    a {
      color: inherit;
      text-decoration: underline;
      text-decoration-color: var(--accent);
      text-decoration-thickness: 0.06em;
      text-underline-offset: 0.18em;
      transition: color 0.2s ease, text-decoration-color 0.2s ease;
    }

    a:hover {
      color: var(--accent);
    }

    a:focus-visible {
      outline: 1px solid var(--accent);
      outline-offset: 4px;
    }

    h1, h2, h3 {
      margin: 0;
      color: var(--text);
      font-family: inherit;
      font-weight: 500;
      letter-spacing: 0;
    }

    .theme-toggle {
      position: fixed;
      top: 1.25rem;
      right: 1.25rem;
      z-index: 10;
      display: grid;
      place-items: center;
      width: 2.25rem;
      height: 2.25rem;
      padding: 0;
      border: 0;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      font: inherit;
      font-size: 1.2rem;
      line-height: 1;
      transition: color 0.2s ease, transform 0.2s ease;
    }

    .theme-toggle:hover {
      color: var(--accent);
      transform: rotate(12deg);
    }

    .theme-toggle:focus-visible {
      outline: 0;
      color: var(--accent);
      text-decoration: underline;
      text-underline-offset: 0.2em;
    }

    .page {
      max-width: 1040px;
      margin: 0 auto;
      padding: 5.5rem 2rem 4rem;
    }

    .topline {
      display: flex;
      gap: 1.25rem;
      margin-bottom: 5rem;
      color: var(--muted);
      font-size: 1rem;
      line-height: 1.4;
    }

    .topline a {
      color: var(--text);
      text-decoration: none;
    }

    .topline a:hover {
      color: var(--accent);
      text-decoration: underline;
      text-decoration-color: var(--accent);
    }

    header {
      max-width: 760px;
      margin-bottom: 4.5rem;
    }

    h1 {
      font-size: 4.75rem;
      line-height: 0.95;
    }

    .lede {
      max-width: 38rem;
      margin-top: 1.15rem;
      color: var(--muted);
      font-size: 1.35rem;
      line-height: 1.45;
    }

    section {
      display: grid;
      grid-template-columns: 11rem minmax(0, 1fr);
      gap: 2rem 4rem;
      padding: 3.75rem 0;
      border-top: 1px solid var(--rule);
    }

    section > h2 {
      grid-column: 1;
      margin-top: 0.25rem;
      color: var(--muted);
      font-size: 1.05rem;
      line-height: 1.4;
    }

    section > :not(h2) {
      grid-column: 2;
    }

    .note-list {
      list-style: none;
      margin: 0;
      padding: 0;
    }

    .note-list li {
      padding: 1.35rem 0;
      border-top: 1px solid var(--rule);
    }

    .note-list li:first-child {
      padding-top: 0;
      border-top: 0;
    }

    .note-title {
      display: inline-block;
      color: var(--text);
      font-size: 1.2rem;
      font-weight: 600;
      line-height: 1.35;
      text-decoration: none;
    }

    .note-title:hover {
      color: var(--accent);
      text-decoration: underline;
      text-decoration-color: var(--accent);
    }

    .note-meta {
      display: block;
      margin-top: 0.35rem;
      color: var(--muted);
      font-size: 1rem;
      line-height: 1.45;
    }

    .empty-note {
      max-width: 38rem;
      color: var(--muted);
      font-size: 1.1rem;
      line-height: 1.65;
    }

    .note-article {
      max-width: 720px;
    }

    .note-article h2,
    .note-article h3 {
      margin: 2.4rem 0 0.8rem;
      line-height: 1.25;
    }

    .note-article h2 {
      font-size: 1.6rem;
    }

    .note-article h3 {
      font-size: 1.28rem;
      font-style: italic;
    }

    .note-article p,
    .note-article ul,
    .note-article ol,
    .note-article pre,
    .note-article blockquote,
    .math-display-source {
      margin: 0 0 1.2rem;
    }

    .note-article ul,
    .note-article ol {
      padding-left: 1.3rem;
    }

    .note-article li + li {
      margin-top: 0.35rem;
    }

    .note-article code {
      font-size: 0.9em;
    }

    .note-article pre {
      overflow-x: auto;
      padding: 1rem 0;
      border-top: 1px solid var(--rule);
      border-bottom: 1px solid var(--rule);
      color: var(--muted);
      line-height: 1.5;
    }

    .note-article blockquote {
      padding-left: 1.25rem;
      border-left: 1px solid var(--rule);
      color: var(--muted);
    }

    @media (max-width: 768px) {
      body {
        font-size: 17px;
      }

      .theme-toggle {
        top: 0.75rem;
        right: 0.75rem;
      }

      .page {
        padding: 4.5rem 1.25rem 3rem;
      }

      .topline {
        margin-bottom: 3rem;
      }

      h1 {
        font-size: 3.25rem;
        line-height: 1;
      }

      .lede {
        font-size: 1.15rem;
      }

      section {
        display: block;
        padding: 3rem 0;
      }

      section > h2 {
        margin: 0 0 1.5rem;
      }
    }

    @media (max-width: 420px) {
      h1 {
        font-size: 2.75rem;
      }
    }

</style>
</head>
<body>
<button aria-label="Switch to dark mode" class="theme-toggle" onclick="toggleDarkMode()"><span aria-hidden="true" id="mode-label">☾</span></button>
<div class="page">
<nav aria-label="Site links" class="topline">
<a href="../index.html">Home</a>
</nav>
<header>
<h1>Notes</h1>
<p class="lede">My notes.</p>
</header>
<main>
<section>
<h2>Index</h2>
<ul class="note-list">
<li><p class="empty-note">No notes yet.</p></li>
</ul>
</section>
</main>
</div>
<script>

    function setThemeControl(isDarkMode) {
      document.getElementById('mode-label').textContent = isDarkMode ? '☼' : '☾';
      document.querySelector('.theme-toggle').setAttribute('aria-label', isDarkMode ? 'Switch to light mode' : 'Switch to dark mode');
    }

    function toggleDarkMode() {
      const body = document.body;
      body.classList.toggle('dark');
      const isDarkMode = body.classList.contains('dark');
      localStorage.setItem('theme', isDarkMode ? 'dark' : 'light');
      setThemeControl(isDarkMode);
    }

    window.onload = () => {
      const isDarkMode = localStorage.getItem('theme') === 'dark';
      if (isDarkMode) {
        document.body.classList.add('dark');
      }
      setThemeControl(isDarkMode);

      renderMathInElement(document.body, {
          delimiters: [
              {left: "$$", right: "$$", display: true}, {left: "$", right: "$", display: false}
          ],
          throwOnError: false
      });
    };

</script>
</body>
</html>
